<style>

      --surface:#19212b;
      --surface-2:#212b36;
      --text:#e9edf2;
      --text-dim:#9aa5b1;

      --accent-soft:#1e3734;
      --good:#5fcf8f;
      --good-soft:#1c3328;
      --bad:#e2816c;
      --bad-soft:#3a2420;
      --border:#2a3340;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#11161d;
    --surface:#19212b;
    --surface-2:#212b36;
    --text:#e9edf2;
    --text-dim:#9aa5b1;
    --accent:#5fd3c4;
    --accent-ink:#bdf0e6;
    --accent-soft:#1e3734;
    --good:#5fcf8f;
    --good-soft:#1c3328;
    --bad:#e2816c;
    --bad-soft:#3a2420;
    --border:#2a3340;

  html,body{height:100%;}
  body{

    background:var(--bg);
    color:var(--text);

    display:flex;

  .app{

    min-height:100%;
    display:flex;
    flex-direction:column;
    padding:16px 16px 20px;

  .title{

    font-weight:600;
    font-size:22px;

  .subtitle{color:var(--text-dim); font-size:13px; margin-top:2px;}

  .progress-row{display:flex; align-items:center; gap:10px; margin-top:12px;}
  .progress-track{flex:1; height:6px; border-radius:99px; background:var(--surface-2); overflow:hidden;}
  .progress-fill{height:100%; background:var(--accent); border-radius:99px; transition:width .3s ease;}
  .progress-label{font-size:12px; color:var(--text-dim); font-variant-numeric:tabular-nums; white-space:nowrap;}

  .tabs{display:flex; gap:6px; margin-top:16px; background:var(--surface-2); padding:4px; border-radius:12px;}
  .tab{
    flex:1; text-align:center; padding:9px 4px; border-radius:9px; font-size:13px; font-weight:600;
    color:var(--text-dim); cursor:pointer; user-select:none; border:none; background:transparent;

  .tab.active{background:var(--surface); color:var(--accent-ink); box-shadow:var(--shadow);}
  .tab .count{font-weight:500; opacity:.75;}

  main{flex:1; display:flex; flex-direction:column; margin-top:18px; min-height:0;}

  .deck-info{display:flex; justify-content:space-between; align-items:baseline; font-size:12px; color:var(--text-dim); margin-bottom:8px; padding:0 2px;}
  .deck-info b{color:var(--text); font-variant-numeric:tabular-nums;}

  .card-wrap{
    perspective:1400px;
    flex:1;
    min-height:280px;
    touch-action:pan-y;
  }
  .card{
    position:relative;
    width:100%;
    height:100%;
    min-height:280px;
    transform-style:preserve-3d;
    transition:transform .45s cubic-bezier(.2,.8,.2,1);
    cursor:pointer;
  }
  .card.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute; inset:0;
    backface-visibility:hidden;
    border-radius:20px;
    background:var(--surface);
    box-shadow:var(--shadow);
    border:1px solid var(--border);
    padding:24px 22px;
    display:flex;
    flex-direction:column;
  }
  .face.back{transform:rotateY(180deg); overflow-y:auto;}

  .type-pill{
    align-self:flex-start;
    font-size:11px; font-weight:700; letter-spacing:.02em;
    color:var(--accent-ink); background:var(--accent-soft);

  .back-pinyin{

  .back-example{font-size:14px; color:var(--text-dim); font-style:italic; line-height:1.5; border-left:3px solid var(--border); padding-left:12px;}

  .controls{display:flex; align-items:center; gap:10px; margin-top:14px;}
  .nav-btn{
    width:44px; height:44px; border-radius:12px; border:1px solid var(--border);
    background:var(--surface); color:var(--text); font-size:18px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;

  .mark-btns{flex:1; display:flex; gap:8px;}
  .mark-btn{
    flex:1; padding:12px 6px; border-radius:12px; border:1px solid var(--border);

  .primary-btn{

  }

</style>

const VOCAB_CACHE_KEY = "ielts_vocab_rows_cache_v1";

function toVocab(rows){
  return rows.map((r,i)=>({id:i, w:r[0], t:r[1], v:r[2], p:r[3], e:r[4]}));
}

// simple CSV parser: handles quoted fields with commas, newlines and "" escapes
function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for(let i=0; i<text.length; i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    }else{
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field = ""; }
      else if(c === '\n' || c === '\r'){
        if(c === '\r' && text[i+1] === '\n') i++;
        row.push(field); field = "";
        rows.push(row); row = [];
      } else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length>1 && r[0] !== "" );
}

["Peer","(n)","bạn đồng trang lứa","tónglíngrén","Teenagers often listen to their peers more than their parents."],
["Consist of","(v)","bao gồm","bāokuò / yóu…zǔchéng","The team consists of five engineers and one designer."],
["Several","(adj/det)","một số, vài","jǐ ge / ruògān","I've been to that restaurant several times."]
];

let VOCAB = toVocab(rowsFromCache() || rowsFromFallback());

const DAY_SIZE = 7;
const LS_KEY = "ielts_vocab_state_v1";

function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {known:{}, weak:{}, cursor:0};
}
function saveState(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
}

let state = loadState();
let mode = "today";
let idx = 0;
let flipped = false;

function todayWords(){
  return VOCAB.slice(state.cursor, Math.min(state.cursor + DAY_SIZE, VOCAB.length));
}
function reviewWords(){
  return VOCAB.filter(w => state.weak[w.id]);
}
function currentDeck(){
  if(mode === "today") return todayWords();
  if(mode === "review") return reviewWords();
  return VOCAB;
}

function render(){
  document.querySelectorAll(".tab").forEach(t=>{
    t.classList.toggle("active", t.dataset.mode === mode);
  });
  document.getElementById("countToday").textContent = "(" + todayWords().length + ")";
  document.getElementById("countReview").textContent = "(" + reviewWords().length + ")";
  document.getElementById("countAll").textContent = "(" + VOCAB.length + ")";

  const knownCount = Object.keys(state.known).filter(k=>state.known[k]).length;
  document.getElementById("progressLabel").textContent = knownCount + "/" + VOCAB.length + " đã thuộc";
  document.getElementById("progressFill").style.width = (knownCount/VOCAB.length*100) + "%";

  const deck = currentDeck();
  const deckArea = document.getElementById("deckArea");
  const deckInfo = document.getElementById("deckInfo");

  if(deck.length === 0){
    deckInfo.textContent = "";
    deckArea.innerHTML = "";
    const empty = document.createElement("div");
    empty.className = "empty-state";
    if(mode === "review"){
      empty.innerHTML = '<div class="big">Không có từ cần ôn 🎉</div><div>Những từ mày chọn "Chưa thuộc" sẽ hiện ở đây.</div>';
    }else if(mode === "today" && state.cursor >= VOCAB.length){
      empty.innerHTML = '<div class="big">Học hết 131 từ rồi!</div><div>Qua tab "Tất cả" để ôn lại bất cứ lúc nào.</div>';
    }else{
      empty.innerHTML = '<div class="big">Chưa có từ</div>';
    }
    deckArea.appendChild(empty);
    return;
  }

  if(mode === "today"){
    const answered = deck.filter(w => state.known[w.id] || state.weak[w.id]).length;
    if(answered === deck.length){
      deckInfo.textContent = "";
      deckArea.innerHTML = "";
      const done = document.createElement("div");
      done.className = "empty-state";
      const knownInBatch = deck.filter(w => state.known[w.id]).length;
      done.innerHTML = '<div class="big">Xong ' + deck.length + ' từ hôm nay! 🎉</div><div>' + knownInBatch + '/' + deck.length + ' thuộc ngay, còn lại nằm ở tab Ôn tập.</div>';
      if(state.cursor + DAY_SIZE < VOCAB.length || state.cursor < VOCAB.length){
        const btn = document.createElement("button");
        btn.className = "primary-btn";
        btn.textContent = "Qua đợt từ tiếp theo →";
        btn.addEventListener("click", ()=>{
          state.cursor = Math.min(state.cursor + DAY_SIZE, VOCAB.length);
          saveState();
          idx = 0; flipped = false;
          render();
        });
        done.appendChild(btn);
      }
      deckArea.appendChild(done);
      return;
    }
  }

  if(idx >= deck.length) idx = 0;
  if(idx < 0) idx = deck.length - 1;
  const w = deck[idx];

  deckInfo.innerHTML = "<span>" + (mode==="today"?"Hôm nay":mode==="review"?"Ôn tập":"Tất cả") + "</span><span><b>" + (idx+1) + "</b>/" + deck.length + "</span>";

  deckArea.innerHTML = `
    <div class="card-wrap">
      <div class="card ${flipped?'flipped':''}" id="cardEl">
        <div class="face front">
          <div class="type-pill">${w.t ? w.t : "từ / cụm từ"}</div>
          <div class="front-word">${w.w}</div>
          <div class="hint">👆 chạm để xem nghĩa</div>
        </div>
        <div class="face back">
          <div class="back-label">Nghĩa</div>
          <div class="back-vi">${w.v}</div>
          <div class="back-pinyin">拼音 ${w.p}</div>
          <div class="back-label">Ví dụ</div>
          <div class="back-example">${w.e}</div>
        </div>
      </div>
    </div>
    <div class="controls">
      <button class="nav-btn" id="prevBtn">‹</button>
      <div class="mark-btns">
        <button class="mark-btn dontknow ${state.weak[w.id]?'active':''}" id="dontKnowBtn">✗ Chưa thuộc</button>
        <button class="mark-btn know ${state.known[w.id]?'active':''}" id="knowBtn">✓ Thuộc rồi</button>
      </div>
      <button class="nav-btn" id="nextBtn">›</button>
    </div>
  `;

  const cardEl = document.getElementById("cardEl");
  cardEl.addEventListener("click", ()=>{ flipped = !flipped; render(); });

  let touchX = null;
  cardEl.addEventListener("touchstart", e=>{ touchX = e.touches[0].clientX; }, {passive:true});
  cardEl.addEventListener("touchend", e=>{
    if(touchX===null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    if(Math.abs(dx) > 50){ dx < 0 ? goNext() : goPrev(); }
    touchX = null;
  }, {passive:true});

  document.getElementById("prevBtn").addEventListener("click", e=>{ e.stopPropagation(); goPrev(); });
  document.getElementById("nextBtn").addEventListener("click", e=>{ e.stopPropagation(); goNext(); });
  document.getElementById("knowBtn").addEventListener("click", e=>{
    e.stopPropagation();
    state.known[w.id] = true;
    delete state.weak[w.id];
    saveState();
    goNext();
  });
  document.getElementById("dontKnowBtn").addEventListener("click", e=>{
    e.stopPropagation();
    state.weak[w.id] = true;
    delete state.known[w.id];
    saveState();
    goNext();
  });
}

function goNext(){ flipped=false; idx = (idx+1) % Math.max(currentDeck().length,1); render(); }
function goPrev(){ flipped=false; const n=currentDeck().length; idx = (idx-1+n) % Math.max(n,1); render(); }

document.querySelectorAll(".tab").forEach(tab=>{
  tab.addEventListener("click", ()=>{
    mode = tab.dataset.mode;
    idx = 0; flipped = false;
    render();
  });
});

render();
syncFromSheet();

function syncFromSheet(){
  fetch(CSV_URL).then(res => {
    if(!res.ok) throw new Error("fetch failed");
    return res.text();
  }).then(text => {
    const rows = parseCSV(text).slice(1) // drop header row
      .map(r => [r[0], r[1], r[2], r[4], r[5]]); // drop Chữ Hán (index 3)
    if(rows.length < 5) throw new Error("unexpected sheet content");
    try{ localStorage.setItem(VOCAB_CACHE_KEY, JSON.stringify(rows)); }catch(e){}
    VOCAB = toVocab(rows);
    if(idx >= currentDeck().length) idx = 0;
    render();
  }).catch(()=>{ /* offline or sheet unreachable: keep cached/fallback data */ });
}

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("service-worker.js").catch(()=>{});
  });
}
</script>
